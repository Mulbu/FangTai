<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方太 · 个性化膳食规划 Agent</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --primary:#0f6f5c; --primary-light:#e6f2ef;
  --accent:#e8a33d; --text:#2a2f36; --muted:#8a929c; --border:#e5e8ec;
  --user-bg:#0f6f5c; --ai-bg:#ffffff; --danger:#c0483f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
header .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#1a9b7e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:12px;color:var(--muted)}
header .spacer{flex:1}
.controls{display:flex;gap:10px;align-items:center;font-size:13px}
.controls select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;max-width:230px}
.controls button{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.controls button:hover{background:var(--primary-light)}
main{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;max-width:860px;width:100%;margin:0 auto}
.msg .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.msg.user .avatar{background:#5470c6}
.msg.ai .avatar{background:var(--primary)}
.bubble{padding:12px 16px;border-radius:12px;line-height:1.7;font-size:14.5px;white-space:pre-wrap;word-break:break-word;max-width:calc(100% - 60px)}
.msg.user .bubble{background:var(--user-bg);color:#fff;border-top-left-radius:4px}
.msg.ai .bubble{background:var(--ai-bg);border:1px solid var(--border);border-top-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.plan-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;max-width:860px;width:100%;margin:0 auto}
.plan-card h4{font-size:13px;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dish{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fbfcfd}
.dish .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dish .role{font-size:11px;background:var(--primary-light);color:var(--primary);padding:1px 8px;border-radius:10px}
.dish .role.soup{background:#fdf1dd;color:#a06a10}
.dish .kept{font-size:11px;background:#eef4ff;color:#3f6ac6;padding:1px 8px;border-radius:10px}
.dish .meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.dish .reason{font-size:12px;color:#4a5361;margin-top:4px}
.nutri{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#4a5361}
.nutri b{color:var(--text)}
.nutri .tag{background:var(--primary-light);color:var(--primary);border-radius:8px;padding:2px 10px}
.constraints{margin-top:8px;font-size:12px;color:var(--muted)}
footer{background:var(--card);border-top:1px solid var(--border);padding:14px 24px}
.input-row{display:flex;gap:10px;max-width:860px;margin:0 auto}
textarea{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;resize:none;height:46px;outline:none}
textarea:focus{border-color:var(--primary)}
.send{padding:0 22px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer}
.send:disabled{background:#a8c5bd;cursor:not-allowed}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.stats{font-size:11px;color:var(--muted);max-width:860px;margin:6px auto 0;text-align:right}
.quick{display:flex;gap:8px;max-width:860px;margin:0 auto 8px;flex-wrap:wrap}
.quick button{font-size:12px;padding:5px 12px;border:1px solid var(--border);background:#fff;border-radius:14px;cursor:pointer;color:#4a5361}
.quick button:hover{border-color:var(--primary);color:var(--primary)}
.welcome{max-width:860px;margin:auto;text-align:center;padding:40px 20px}
.welcome h2{font-size:20px;margin-bottom:8px;color:var(--primary)}
.welcome p{color:var(--muted);font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<header>
  <div class="logo">🍲</div>
  <div>
    <h1>个性化膳食规划 Agent</h1>
    <div class="sub">方太 AI 专项赛 · RAG + 多约束推理 + 营养估算</div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <label>健康档案</label>
    <select id="profileSel" multiple size="1" title="可多选：多人宴请场景"></select>
    <button id="newChat">新对话</button>
  </div>
</header>
<main id="chat">
  <div class="welcome" id="welcome">
    <h2>您好，我是您的健康膳食助手 🥗</h2>
    <p>告诉我吃什么、几个人吃、有什么忌口，我来为您规划一餐<br>选择左侧健康档案后，推荐会自动规避过敏原与慢病忌口</p>
  </div>
</main>
<footer>
  <div class="quick">
    <button data-q="今晚吃啥比较好？">今晚吃啥</button>
    <button data-q="帮我安排一顿两人的晚餐，最近在减脂">两人减脂晚餐</button>
    <button data-q="做个四菜一汤，小孩不吃辣，老人牙口不好">四菜一汤家宴</button>
    <button data-q="我今晚下班晚，想做个半小时内能搞定的晚饭">半小时晚饭</button>
  </div>
  <div class="input-row">
    <textarea id="input" placeholder="例如：家里就剩番茄、鸡蛋和土豆，怎么弄一顿正餐？"></textarea>
    <button class="send" id="send">发送</button>
  </div>
  <div class="stats" id="stats"></div>
</footer>
<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), input = $('#input'), send = $('#send');
let sessionId = null, profileIds = [], busy = false;

async function loadProfiles(){
  const r = await fetch('/api/profiles?kind=simple');
  const d = await r.json();
  const sel = $('#profileSel');
  sel.innerHTML = '';
  d.items.forEach(p=>{
    const opt = document.createElement('option');
    opt.value = p.id;
    const tags = [];
    if((p['特殊人群']||[]).length) tags.push(p['特殊人群'].join('/'));
    if((p['过敏食材']||[]).length) tags.push('过敏:'+p['过敏食材'].join('/'));
    opt.textContent = `${p.id}号 ${p['性别']} ${p['年龄']}岁 ${tags.join(' ')}`;
    sel.appendChild(opt);
  });
  sel.size = Math.min(6, Math.max(3, d.items.length));
  sel.addEventListener('change', ()=>{
    profileIds = [...sel.selectedOptions].map(o=>+o.value);
  });
  sel.selectedIndex = 2;
  profileIds = [d.items[2].id];
}

function addMsg(role, text){
  $('#welcome')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  div.innerHTML = `<div class="avatar">${role==='user'?'🧑':'🥗'}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector('.bubble');
}

function addTyping(){
  const b = addMsg('ai','');
  b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  return b;
}

function renderPlan(ev){
  $('#welcome')?.remove();
  const card = document.createElement('div');
  card.className = 'plan-card';
  const dishes = (ev.dishes||[]).map(d=>`
    <div class="dish">
      <div class="name">${d.name}
        <span class="role ${d.role==='汤'?'soup':''}">${d.role}</span>
        ${d.kept?'<span class="kept">沿用</span>':''}
      </div>
      <div class="meta">${(d.ingredients||[]).slice(0,6).join('、')}</div>
      ${d.reason?`<div class="reason">💡 ${d.reason}</div>`:''}
    </div>`).join('');
  const n = ev.nutrition_per_person||{};
  const nut = n.intake||{};
  const dev = (n.deviation_pct||{}).kcal;
  card.innerHTML = `
    <h4>📋 本餐方案（${ev.people||2}人 · ${ev.meal||''}）</h4>
    <div class="dishes">${dishes}</div>
    <div class="nutri">
      <span>每人约 <b>${nut.kcal??'-'}</b> kcal</span>
      <span>蛋白质 <b>${nut.protein_g??'-'}</b>g</span>
      <span>脂肪 <b>${nut.fat_g??'-'}</b>g</span>
      <span>碳水 <b>${nut.carbs_g??'-'}</b>g</span>
      <span class="tag">${n.purine_level||''}</span>
      ${dev!==undefined?`<span>热量偏差 ${dev}%</span>`:''}
    </div>
    <div class="constraints">✅ 已满足约束：${ev.constraints_applied||''}</div>`;
  chat.appendChild(card);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg(){
  const text = input.value.trim();
  if(!text || busy) return;
  busy = true; send.disabled = true;
  input.value = '';
  addMsg('user', text);
  const bubble = addTyping();
  const t0 = performance.now();
  let firstTok = null, replaced = false;
  try{
    const resp = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, session_id:sessionId, profile_ids:profileIds})
    });
    sessionId = resp.headers.get('X-Session-Id') || sessionId;
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      while(buf.includes('\n\n')){
        const raw = buf.slice(0, buf.indexOf('\n\n'));
        buf = buf.slice(buf.indexOf('\n\n')+2);
        if(!raw.startsWith('data: ')) continue;
        let ev; try{ ev = JSON.parse(raw.slice(6)); }catch(e){ continue; }
        if(ev.type==='plan'){ renderPlan(ev); }
        else if(ev.type==='delta'){
          if(firstTok===null) firstTok = performance.now()-t0;
          if(!replaced){ bubble.textContent=''; replaced=true; }
          bubble.textContent += ev.text;
          chat.scrollTop = chat.scrollHeight;
        }
        else if(ev.type==='clarify'){ if(!replaced){ bubble.textContent=''; replaced=true; } bubble.textContent += ev.question; }
        else if(ev.type==='done'){
          const s = ev.stats||{};
          $('#stats').textContent = `首Token ${firstTok?(firstTok/1000).toFixed(2):'-'}s · 端到端 ${((performance.now()-t0)/1000).toFixed(2)}s`;
        }
      }
    }
  }catch(e){
    bubble.textContent = '出错了：' + e.message;
  }finally{
    busy = false; send.disabled = false;
  }
}

send.onclick = sendMsg;
input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
});
$('#newChat').onclick = ()=>{ sessionId=null; chat.innerHTML=''; $('#stats').textContent=''; };
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{ input.value=b.dataset.q; sendMsg(); });

loadProfiles();
</script>
</body>
</html>
